a</text></g><g class="link" data-entity-1="OBS" data-entity-2="N" data-uid="lnk19" id="link_OBS_N"><polygon fill="#456079" points="727.5522,763.368,737.3483,764.386,732.3067,761.8204,734.8722,756.7788,727.5522,763.368" style="stroke:#456079;stroke-width:1;"/><path d="M846.1263,583.4209 C849.3692,589.0627 852.2045,595.1075 854,601.1973 C863.6783,634.0224 872.564,649.4477 854,678.1973 C825.7763,721.9064 780.6362,746.0895 733.2576,761.5109" fill="none" style="stroke:#456079;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137.2617" x="867" y="644.8911">I-09 &#183; observar m&#233;tricas</text></g><g class="legend" data-source-line="29"><rect fill="#DDDDDD" height="154.8877" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="476.1426" x="12" y="831.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="281.7363" x="17" y="849.3291">Interfaces: etiquetas sobre las dependencias.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="420.2051" x="17" y="865.4277">I-08 termina l&#243;gicamente en C-03; RabbitMQ transporta los hechos.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="391.4668" x="17" y="881.5264">C-03: autoridad de decisi&#243;n, selecci&#243;n de nodo y recuperaci&#243;n.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="453.6943" x="17" y="897.625">C-06: &#250;nica autoridad de estado; Repository usa SQLAlchemy / psycopg.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="349.4189" x="17" y="913.7236">C-04: buffer reconciliable; ack no equivale a finalizaci&#243;n.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="406.1846" x="17" y="929.8223">C-05: sin comunicaci&#243;n Nodo &#8596; Nodo ni escritura directa a C-06.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="466.1426" x="17" y="945.9209">I-09 observa C-02..C-06 mediante instrumentaci&#243;n, sin autoridad funcional.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="439.6602" x="17" y="962.0195">Prometheus hace pull/scrape; logs JSON a stdout. Enlaces resumidos.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="376.6123" x="17" y="978.1182">C-02, C-03 y dispatcher comparten runtime (ver despliegue).</text></g><!--SRC=[PLNDSYCr4BxFKpJX0hM9yxD9TkEbg7Ay2PWYZhD9JfX3MzCU2skaMVqaQnw09-0bE58vKCKHlmbFGhV6ThpXD1gf- -jMVr-tlcWyLZM2mOLB4K9D4IqMKKT3C7IbkpJk4Vxv2_gkRfmb6ocCxO0_VegA0Yn0iOFXLKcC0kW_9Xr9nUGH7dGb7aLq3KG74nUZgw7Kdi-riqMOQzkWnnhK6lusBZXogitHrccOOUaUjQrWYYRGrab9KqmcNZeRXrWJzBn6itLkNKc16ZWyEDZQzMZd_z_Tv72EQbvvbspPTyPv-FAYTtbq-NRBjEUzUrmT7f-S7hmvAr15_jkv3mczTh0FrmrvJjll00QuBpReiDFVEpZCDJLQoZEsFLibWolBmGlJ8p7jZGPIO6oCLgZqyicExIM6AFlxSF-WbVCs-_FE2u3NBN_EbzfAGcDxHQL6IPSFFb3q2vWcgvWHD6Fx2h349eebNASuSP-OiT1WL3DgK-mN9KQSOA2CVoem8nTYvUdsviUnlSCmvwnwCLBTH5wna8W_7oWmLmpC2Yhvo4NYg2Yrod4o-FlpucEYr48VvmnnCj7nwcPiHzwLIP7VwpiRKhrAv-hcnOLFn4l42pyTTZh3dzbn4MVESY3KRg_HS-GaPvwm73bdBZwHIb8DL4woow335vXl1FDw4iW_u4GRNMAPy-66cL4A3FsTnoct0g-CgmByS7izp4ZNvxV5FUpjVIlKtW_oIcZhma1qi2-VpF7tTtUZVN4RMyMvUJvISaykcQoTwCaNuYeGVGPGArAp841BLtBphYtUdxSnNhSqDovelkLYnS-hDRaObqyrwoTinGj5_mL4JlEu_PoCxJCSRqNkfw3R91YXrAsKDhmos3U2TdNJefssC6-piAzkHcCRQFbd7YBCKD2Lt8XBBxypKZCN2dRD4CCrmiQLWq_m5oTJHLUwbCxpd9pdGLKCDvKQh1ZSgh6dIeVeNGw2Fau8HQiA6uxEzBRbO0EpgIXJcR4E3mHhNIn05dx5JLF8UQUpoV9Ch5oh6G_rye_ekNj3OOZ7OhaUXuQciG1udgbTeAYv1vW626xYPQxAU6tOAJTCw8Yz591TQkOVpFAfOkXQnWcG1UdwTvl6QGcIch0byzpML434hWiewizNvZOjIUaWLEv284EgfPKFh3JKWekhaYWnxwymJhkm_Djo0fz3KP1sUhUbFKW1WMT4p_0mgKKxJLWerrGheECkJD9qIbx2EBwhqJWnz8vRSyu90F7Zyi120OGftzleNp_BuwGBGOi6wsJNSx8T1F_-zdkxi9hJKbxdzwbzYJZhV8bLLS_MbCdcKQUJ9rmj4rEAgorh9acXM_ZT7F7vsfj1AcXRys76p4