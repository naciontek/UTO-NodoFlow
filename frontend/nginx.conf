server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://application:8000/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
